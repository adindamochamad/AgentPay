# Konfigurasi logging produksi: JSON ke stdout untuk agregasi log.
# Level diganti lewat defaults di fileConfig (INFO / WARNING produksi).
# Filter menambahkan timestamp ISO dan request_id dari contextvars.

[loggers]
keys=root,uvicorn,uvicorn.access,uvicorn.error

[handlers]
keys=stdout

[formatters]
keys=json

[logger_root]
level=%(level_root)s
handlers=stdout
qualname=

[logger_uvicorn]
level=%(level_uvicorn)s
handlers=stdout
qualname=uvicorn
propagate=0

[logger_uvicorn.access]
level=%(level_uvicorn)s
handlers=stdout
qualname=uvicorn.access
propagate=0

[logger_uvicorn.error]
level=%(level_uvicorn)s
handlers=stdout
qualname=uvicorn.error
propagate=0

[handler_stdout]
class=logging.StreamHandler
formatter=json
args=(sys.stdout,)

[formatter_json]
class=pythonjsonlogger.jsonlogger.JsonFormatter
format=%(waktu_iso)s %(levelname)s %(message)s %(id_permintaan)s %(name)s
