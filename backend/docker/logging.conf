# Salinan konfigurasi logging produksi untuk image backend (context build = ./backend).
# Dokumentasi: lihat juga docker/backend/logging.conf di root repositori.

[loggers]
keys=root,uvicorn,uvicorn.access,uvicorn.error

[handlers]
keys=stdout

[formatters]
keys=json

[logger_root]
level=%(level_root)s
handlers=stdout
qualname=

[logger_uvicorn]
level=%(level_uvicorn)s
handlers=stdout
qualname=uvicorn
propagate=0

[logger_uvicorn.access]
level=%(level_uvicorn)s
handlers=stdout
qualname=uvicorn.access
propagate=0

[logger_uvicorn.error]
level=%(level_uvicorn)s
handlers=stdout
qualname=uvicorn.error
propagate=0

[handler_stdout]
class=logging.StreamHandler
formatter=json
args=(sys.stdout,)

[formatter_json]
class=pythonjsonlogger.jsonlogger.JsonFormatter
format=%(waktu_iso)s %(levelname)s %(message)s %(id_permintaan)s %(name)s
